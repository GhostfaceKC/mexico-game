<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Couple's Spanish Phrasebook</title>
  <style>
    :root {
      --bg-dark: #121826;
      --card-bg: #1e293b;
      --accent-rose: #f43f5e;
      --accent-gold: #f59e0b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    /* Modal / Container Shell */
    .phrasebook-container {
      max-width: 600px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-color);
    }

    .modal-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      margin: 0 0 6px 0;
      font-size: 1.5rem;
      color: var(--text-main);
    }

    .modal-header p {
      margin: 0;
      font-size: 0.9rem;
      color: var(--text-sub);
    }

    /* Category Filter Buttons */
    .category-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }

    .category-tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--accent-rose);
      color: #fff;
      border-color: var(--accent-rose);
      font-weight: 600;
    }

    /* Phrase List & Cards */
    .phrase-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .phrase-card {
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.2s ease;
    }

    .phrase-card.risque {
      border-left: 4px solid var(--accent-rose);
    }

    .phrase-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-right: 12px;
    }

    .phrase-en {
      font-size: 0.85rem;
      color: var(--text-sub);
      font-weight: 500;
    }

    .phrase-es {
      font-size: 1.1rem;
      color: #fff;
      font-weight: 600;
    }

    .phrase-note {
      font-size: 0.75rem;
      color: var(--accent-gold);
      font-style: italic;
      margin-top: 2px;
    }

    /* Action Buttons */
    .phrase-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: #1e293b;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .icon-btn:active {
      transform: scale(0.92);
      background: var(--accent-rose);
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--accent-rose);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 1000;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="phrasebook-container">
    <div class="modal-header">
      <h2>🇲🇽 Spanish Phrasebook</h2>
      <p>Tailored for couples in Mexico</p>
    </div>

    <!-- Category Filter Tabs -->
    <div class="category-tabs" id="categoryTabs">
      <button class="tab-btn active" data-category="all">All</button>
      <button class="tab-btn" data-category="drinks">🍹 Drinks</button>
      <button class="tab-btn" data-category="romantic">❤️ Romantic</button>
      <button class="tab-btn" data-category="flirty">💃 Flirty</button>
      <button class="tab-btn" data-category="spicy">🌶️ Spicy</button>
    </div>

    <!-- Phrase Cards Feed -->
    <div class="phrase-list" id="phraseList"></div>
  </div>

  <!-- Toast Pop-up -->
  <div id="toast" class="toast">Copied to clipboard!</div>

  <script>
    // Master Phrasebook Dataset
    const phrases = [
      // DRINKS & ESSENTIALS
      {
        id: 1,
        category: "drinks",
        en: '"Another drink, love?"',
        es: '¿Otro trago, mi amor?',
        note: 'Natural Mexican slang for an alcoholic drink'
      },
      {
        id: 2,
        category: "drinks",
        en: '"Can I buy you a drink?"',
        es: '¿Te puedo invitar un trago?',
        note: 'Sweet & classic'
      },

      // ROMANTIC & AFFECTIONATE
      {
        id: 3,
        category: "romantic",
        en: '"You look gorgeous"',
        es: 'Te ves hermosísima, mi amor',
        note: 'Use "guapísimo" for him'
      },
      {
        id: 4,
        category: "romantic",
        en: '"You have a beautiful smile"',
        es: 'Tienes una sonrisa hermosa',
        note: 'Warm compliment'
      },
      {
        id: 5,
        category: "romantic",
        en: '"I\'m so lucky to have you"',
        es: 'Qué suerte tengo de tenerte',
        note: 'Sweet couple staple'
      },
      {
        id: 6,
        category: "romantic",
        en: '"I love you so much"',
        es: 'Te amo muchísimo',
        note: 'Deep affection'
      },

      // FLIRTY & PLAYFUL
      {
        id: 7,
        category: "flirty",
        en: '"Kiss me right now"',
        es: 'Dame un beso ahora mismo',
        note: 'Playful & affectionate'
      },
      {
        id: 8,
        category: "flirty",
        en: '"Let\'s go back to the room"',
        es: 'Regresemos al cuarto',
        note: 'Natural way to say go back'
      },
      {
        id: 9,
        category: "flirty",
        en: '"I can\'t stop looking at you"',
        es: 'No puedo dejar de mirarte',
        note: 'Seductive gaze'
      },
      {
        id: 10,
        category: "flirty",
        en: '"Would you like to dance?"',
        es: '¿Quieres bailar conmigo?',
        note: 'Great for resort music/nightlife'
      },
      {
        id: 11,
        category: "flirty",
        en: '"You still drive me crazy"',
        es: 'Me sigues volviendo loco',
        note: 'Use "loca" if female'
      },

      // SPICY & RISQUÉ
      {
        id: 12,
        category: "spicy",
        en: '"You have no idea what I want to do to you"',
        es: 'No tienes idea de lo que quiero hacerte',
        note: 'Whisper in the ear'
      },
      {
        id: 13,
        category: "spicy",
        en: '"I can\'t wait to take your clothes off"',
        es: 'Tengo muchas ganas de quitarte la ropa',
        note: 'Direct & passionate'
      }
    ];

    const phraseListEl = document.getElementById("phraseList");
    const categoryTabs = document.getElementById("categoryTabs");
    const toastEl = document.getElementById("toast");

    // Render Function
    function renderPhrases(filter = "all") {
      phraseListEl.innerHTML = "";
      
      const filtered = filter === "all" 
        ? phrases 
        : phrases.filter(p => p.category === filter);

      filtered.forEach(p => {
        const isSpicy = p.category === "spicy";
        const card = document.createElement("div");
        card.className = `phrase-card ${isSpicy ? "risque" : ""}`;

        card.innerHTML = `
          <div class="phrase-content">
            <span class="phrase-en">${p.en}</span>
            <span class="phrase-es">${p.es}</span>
            <span class="phrase-note">${p.note}</span>
          </div>
          <div class="phrase-actions">
            <button class="icon-btn" onclick="speakText('${escapeQuotes(p.es)}')" title="Listen">🔊</button>
            <button class="icon-btn" onclick="copyText('${escapeQuotes(p.es)}')" title="Copy">📋</button>
          </div>
        `;
        phraseListEl.appendChild(card);
      });
    }

    // Filter Tab Click Handling
    categoryTabs.addEventListener("click", (e) => {
      if (e.target.classList.contains("tab-btn")) {
        document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
        e.target.classList.add("active");
        renderPhrases(e.target.dataset.category);
      }
    });

    // Helper: Escape quotes for inline onclick strings
    function escapeQuotes(str) {
      return str.replace(/'/g, "\\'");
    }

    // Audio Speech Synth (Spanish Accent)
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Stop active speech
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'es-MX';
        utterance.rate = 0.9; // Slightly slower for clear pronunciation
        window.speechSynthesis.speak(utterance);
      } else {
        showToast("Audio not supported on this browser");
      }
    }

    // Copy to Clipboard Function
    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast("Copied to clipboard!");
      }).catch(() => {
        showToast("Failed to copy");
      });
    }

    // Toast Alert
    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("show");
      setTimeout(() => {
        toastEl.classList.remove("show");
      }, 2000);
    }

    // Initial Render
    renderPhrases("all");
  </script>
</body>
</html>
